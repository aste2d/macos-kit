<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>aste2d · 快捷键</title><style>*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;color:#ebebef;background:radial-gradient(ellipse at 50% -20%,#35373f 0,#141519 55%);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}main{max-width:1120px;margin:auto;padding:55px 28px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:35px}h1{font-size:36px;letter-spacing:-1.3px;line-height:1.2;margin:10px 0}p{color:#9799a4;margin:8px 0}.brand{font-size:11px;letter-spacing:3px;color:#b0b1bc}a{color:#ffb294;text-decoration:none}button,input,select{font:inherit}button,a,input,select{outline-offset:4px}.subtle{font-size:12px;color:#848793}.toolbar{display:flex;gap:12px;margin-bottom:25px}input,select{border:1px solid #54565f;border-bottom-color:#25262e;border-radius:10px;background:linear-gradient(#363840,#24262d);box-shadow:0 1px 0 #ffffff18 inset,0 4px 14px #0003;color:#eeeff4;padding:13px 15px}input{flex:1;min-width:0}select{max-width:180px}.groups{display:grid;grid-template-columns:1fr 1fr;gap:20px}.group{border:1px solid #44464f;border-bottom-color:#202127;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#30323a,#22242b 40%,#1f2026);box-shadow:0 1px 0 #ffffff17 inset,0 14px 35px #0003}.group h2{font-size:12px;letter-spacing:1px;margin:0;padding:15px 19px;color:#a8aab4;border-bottom:1px solid #ffffff0b}.item{display:flex;gap:20px;justify-content:space-between;align-items:center;padding:16px 19px;border-bottom:1px solid #ffffff08}.item:last-child{border:0}.item strong{display:block;font-weight:500;font-size:14px}.item p{font-size:11px;line-height:1.5;margin:3px 0 0;max-width:290px}.keys{flex-shrink:0;display:inline-block;padding:5px 9px;border:1px solid #656772;border-bottom:3px solid #121319;border-radius:6px;background:linear-gradient(#454750,#292b32);box-shadow:0 1px 0 #fff2 inset,0 3px 5px #0004;font-size:12px;color:#ffd0b9;white-space:nowrap}.empty{padding:40px;text-align:center;color:#a4a6b0}.hint{margin:24px 0;padding:20px;border:1px solid #353741;border-radius:12px;color:#a3a5af;font-size:12px}.hint b{color:#dddfe7}footer{display:flex;justify-content:space-between;margin-top:30px;font-size:11px;color:#686c78}@media(max-width:760px){main{padding:30px 18px}.groups{grid-template-columns:1fr}h1{font-size:28px}.toolbar{flex-wrap:wrap}select{max-width:none}header{align-items:flex-start;gap:15px}.item{padding:15px}input{min-width:180px}}@media print{body{background:white;color:black}main{max-width:none;padding:0}.toolbar,header a{display:none}.groups{display:block}.group{break-inside:avoid;background:white;box-shadow:none;border-color:#bbb;margin:10px 0}.group h2,.item p{color:#555}.keys{background:#eee;color:black;border:1px solid #999;box-shadow:none}.hint{color:#444}footer{color:#555}}</style><main><header><div><span class="brand">ASTE2D · MACOS</span><h1>快捷键，触手可及。</h1><p>Hyper = ⌃ ⌥ ⇧ ⌘ · 按住 Caps Lock</p></div><a href="README.md">使用指南 ↗</a></header><div class="toolbar"><input id="q" type="search" aria-label="搜索快捷键" placeholder="搜索功能、按键或应用…"><select id="category" aria-label="筛选来源"><option value="">全部快捷键</option></select></div><div id="groups" class="groups"></div><div class="hint"><b>按键位置</b><br>默认交换 Command 与 Option；Apple 内置及外接键盘均保持原位。F3 为 Globe（Fn），标准 F1–F12 模式关闭。Caps Lock 轻点输出反引号，同时按左右 Shift 切换大写锁定。<br>系统服务需要相应的选择对象：智能简繁用于可编辑的所选文字；Keka 用于选中的文件。</div><footer><a href="https://github.com/aste2d/">aste2d</a><span id="count"></span><span>离线可用 · ⌘P 打印</span></footer></main><script>const entries=[{"keys": "⌘Space", "action": "打开 Raycast", "source": "Raycast", "note": "唤起应用与命令搜索。"}, {"keys": "⌥1", "action": "访达", "source": "Raycast", "note": ""}, {"keys": "Hyper+P", "action": "密码", "source": "Raycast", "note": "别名 p"}, {"keys": "⌥4", "action": "音乐", "source": "Raycast", "note": "别名 m"}, {"keys": "Hyper+G", "action": "ChatGPT", "source": "Raycast", "note": "别名 c"}, {"keys": "⌥2", "action": "Discord", "source": "Raycast", "note": ""}, {"keys": "Hyper+T", "action": "Ghostty", "source": "Raycast", "note": "别名 t"}, {"keys": "⌥3", "action": "Google Chrome", "source": "Raycast", "note": ""}, {"keys": "Hyper+I", "action": "iPhone 镜像", "source": "Raycast", "note": "别名 i"}, {"keys": "Hyper+V", "action": "Clipboard History", "source": "Raycast", "note": ""}, {"keys": "Hyper+D", "action": "Show Latest Download", "source": "Raycast", "note": ""}, {"keys": "Hyper+E", "action": "Search Emoji & Symbols", "source": "Raycast", "note": "别名 e"}, {"keys": "⌘\\", "action": "Search Files", "source": "Raycast", "note": "别名 f"}, {"keys": "Hyper+K", "action": "Kill Process", "source": "Raycast", "note": "别名 kp"}, {"keys": "Hyper+B", "action": "Search Menu Bar Items", "source": "Raycast", "note": ""}, {"keys": "Hyper+A", "action": "Almost Maximize", "source": "Raycast", "note": "别名 a"}, {"keys": "Hyper+X", "action": "Maximize", "source": "Raycast", "note": "别名 x"}, {"keys": "Hyper+F", "action": "Toggle Fullscreen", "source": "Raycast", "note": ""}, {"keys": "Hyper+Enter", "action": "Toggle System Appearance", "source": "Raycast", "note": ""}, {"keys": "Hyper+Space", "action": "播放 / 暂停", "source": "Karabiner", "note": "系统媒体键"}, {"keys": "Hyper+M", "action": "静音 / 取消静音", "source": "Karabiner", "note": "切换输出设备的静音状态。"}, {"keys": "Hyper+,", "action": "降低音量", "source": "Karabiner", "note": "可长按"}, {"keys": "Hyper+.", "action": "提高音量", "source": "Karabiner", "note": "可长按"}, {"keys": "⌥⇧S", "action": "将所选区域拷贝到剪贴板", "source": "Karabiner", "note": "映射到 Hyper+S"}, {"keys": "按住 Caps Lock", "action": "Hyper：⌃⌥⇧⌘", "source": "Karabiner", "note": "松开后恢复"}, {"keys": "轻点 Caps Lock", "action": "反引号 `", "source": "Karabiner", "note": "输出反引号。"}, {"keys": "左 Shift + 右 Shift", "action": "切换大写锁定", "source": "Karabiner", "note": "两侧 Shift 同时按下"}, {"keys": "Hyper+C", "action": "智能简繁转换", "source": "Smart Chinese", "note": "多数简体→繁体；多数繁体→简体；同数→繁体。只作用于所选文字。"}, {"keys": "⌃Space", "action": "发送到 Keka", "source": "服务", "note": "在 Finder 中选择文件"}, {"keys": "⌃T", "action": "在此处打开 Ghostty 窗口", "source": "服务", "note": "需要应用提供该服务"}, {"keys": "Hyper+R", "action": "截屏和录制选项", "source": "macOS", "note": ""}, {"keys": "⌘Esc", "action": "游戏叠层", "source": "macOS", "note": ""}, {"keys": "⌘`", "action": "将焦点移到下一个窗口", "source": "macOS", "note": ""}, {"keys": "Hyper+S", "action": "将所选区域的图片拷贝到剪贴板", "source": "macOS", "note": ""}, {"keys": "⌥Tab", "action": "调度中心", "source": "macOS", "note": ""}, {"keys": "⌥`", "action": "应用程序窗口", "source": "macOS", "note": ""}, {"keys": "⌥⌘D", "action": "打开/关闭隐藏程序坞", "source": "macOS", "note": ""}, {"keys": "⌥Space", "action": "选择“输入法”菜单中的下一个输入法", "source": "macOS", "note": ""}, {"keys": "⌥⌘Space", "action": "显示“聚焦”搜索", "source": "macOS", "note": ""}, {"keys": "Fn+⌃⌥←", "action": "向左移动一个空间", "source": "macOS", "note": ""}, {"keys": "Fn+⌃⌥→", "action": "向右移动一个空间", "source": "macOS", "note": ""}, {"keys": "⇧⌘/", "action": "显示帮助菜单", "source": "macOS", "note": ""}, {"keys": "Tab", "action": "Minimize（最小化窗口菜单）", "source": "应用菜单", "note": "在提供 Minimize 菜单项的应用中生效；按需启用。"}, {"keys": "Hyper+Z", "action": "检测显示器", "source": "显示器工具", "note": "松开组合键后打开显示器设置并执行检测；支持简体中文和英文系统界面。"}, {"keys": "Command ↔ Option", "action": "交换 Command 与 Option（Apple 键盘除外）", "source": "Karabiner", "note": "默认交换；Apple 内置键盘及外接 Apple 键盘保持原位。"}, {"keys": "F3", "action": "Globe（Fn）", "source": "Karabiner", "note": "单按 F3；标准 F1–F12 模式关闭。Print Screen 保持原功能。"}, {"keys": "F1–F12", "action": "标准功能键（Java / 远程控制）", "source": "Karabiner", "note": "Java、UU 远程、Chrome Remote Desktop（PWA）及匹配的远程应用前台生效；包括 F3。其他应用保留原行为。"}];const q=document.getElementById('q'),select=document.getElementById('category'),root=document.getElementById('groups');const sources=[...new Set(entries.map(x=>x.source))];for(const s of sources){const o=document.createElement('option');o.value=s;o.textContent=s;select.append(o)}function render(){const a=entries.filter(x=>(!select.value||select.value===x.source)&&Object.values(x).join(' ').toLowerCase().includes(q.value.toLowerCase().trim()));root.replaceChildren();for(const s of sources){const rows=a.filter(x=>x.source===s);if(!rows.length)continue;const g=document.createElement('section');g.className='group';const h=document.createElement('h2');h.textContent=s;g.append(h);for(const x of rows){const row=document.createElement('div');row.className='item';const d=document.createElement('div'),title=document.createElement('strong'),note=document.createElement('p'),key=document.createElement('span');title.textContent=x.action;note.textContent=x.note||'';key.className='keys';key.textContent=x.keys;d.append(title);if(x.note)d.append(note);row.append(d,key);g.append(row)}root.append(g)}if(!a.length){const p=document.createElement('p');p.className='empty';p.textContent='没有匹配的快捷键';root.append(p)}document.getElementById('count').textContent=a.length+' 个快捷键'}q.oninput=render;select.onchange=render;render();</script></html>
